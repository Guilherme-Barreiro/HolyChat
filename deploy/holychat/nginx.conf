# Public Matrix client proxy; port 8008 is published on host loopback only.
map $http_cf_connecting_ip $holychat_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/_matrix/(client|media)(/|$) {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $holychat_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/_synapse/client(/|$) {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $holychat_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 403; }
}

# Private administrative interface: host 127.0.0.1:18008 ONLY.
# Never forward this port via Cloudflare or expose it on an external interface.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    location / {
        proxy_pass http://synapse:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
