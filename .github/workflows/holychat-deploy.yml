name: HolyChat deployment checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check installation shell syntax
        run: bash -n deploy/holychat/apply.sh deploy/holychat/verify.sh
      - name: Compile deployment Python scripts
        run: python -m py_compile deploy/holychat/render_compose.py deploy/holychat/render_homeserver.py
      - name: Test configuration transformations
        run: python -m unittest discover -s deploy/holychat/tests -v
      - name: Validate Nginx configuration
        run: |
          docker run --rm --add-host synapse:127.0.0.1 \
            -v "$PWD/deploy/holychat/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t
